# Two independent chains, one per schema (D26). Select one with -n:
#   alembic -n visits upgrade head
#   alembic -n billing upgrade head
# The database URL comes from MIGRATIONS_DATABASE_URL (role jiris_migrator, D29).

[visits]
script_location = %(here)s/app/visits/migrations
prepend_sys_path = .
path_separator = os

[billing]
script_location = %(here)s/app/billing/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
