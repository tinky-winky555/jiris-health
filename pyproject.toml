[project]
name = "jiris-health"
version = "0.1.0"
description = "Visits and Billing modular monolith with a transactional outbox over RabbitMQ"
readme = "README.md"
requires-python = ">=3.15.2"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.4",
    "faststream[rabbit]>=0.7.8",
    "httptools>=0.9.0",
    "pydantic>=2.14.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn>=0.54.0",
    "uvloop>=0.23.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.16",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "testcontainers>=4.15.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs Docker (PostgreSQL and RabbitMQ testcontainers)",
]
