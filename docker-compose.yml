x-app-env: &app-env
  VISITS_DATABASE_URL: postgresql+asyncpg://visits_app:visits_app@postgres:5432/jiris
  BILLING_DATABASE_URL: postgresql+asyncpg://billing_app:billing_app@postgres:5432/jiris
  MIGRATIONS_DATABASE_URL: postgresql+asyncpg://jiris_migrator:jiris_migrator@postgres:5432/jiris
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: jiris
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jiris"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    build: .
    command: ["sh", "-c", "alembic -n visits upgrade head && alembic -n billing upgrade head"]
    environment: *app-env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: ["uvicorn", "--factory", "app.main_api:create_app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.main_worker"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
